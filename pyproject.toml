[project]
name = "document-converter"
dynamic = ["version"]
description = "Document Converter: documente Office în PDF, PDF în DOCX, plus unelte PDF"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Robert-Raul Mîrza" }]
requires-python = ">=3.10"
dependencies = [
    "pywin32>=306",
    "ttkbootstrap>=2.2",
    "tkinterdnd2>=0.4",
    "pypdf>=5.0",
    "pycryptodome>=3.20",
    "reportlab>=4.0",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

[project.scripts]
docconv = "convertor.cli:main"

[project.gui-scripts]
document-converter = "convertor.gui:main"

[tool.setuptools.dynamic]
version = { attr = "convertor.__version__" }

[tool.setuptools.packages.find]
include = ["convertor*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["installer"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # ghilimele romanesti „…” si diacritice in texte
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "office: necesită Microsoft Office instalat (lent)",
    "ocr: necesită Tesseract OCR instalat",
]
# faulthandler raporteaza ca „fatal” deconectarile COM tratate (cand oprim Word in teste)
addopts = "-ra -p no:faulthandler"
