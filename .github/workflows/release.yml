name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      # aceleasi versiuni (cu hash-uri) ca la build
      - run: pip install --require-hashes -r requirements.lock
      - run: ruff check .
      # aceiasi markeri ca in build.ps1 si ci.yml
      - run: pytest -m "not office and not ocr" -q

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # necesar ca să poată crea release-ul
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Venv și dependențe din requirements.lock (build.ps1 cere .venv)
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --require-hashes -r requirements.lock

      # versiune fixata, ca installer-ul sa fie construit mereu cu acelasi compilator
      - name: Instalez Inno Setup
        run: choco install innosetup --version 6.7.1 -y --no-progress

      - name: Tag-ul trebuie să fie egal cu versiunea din cod
        shell: pwsh
        run: |
          $v = (.venv\Scripts\python.exe -c "import convertor; print(convertor.__version__)").Trim()
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG != v$v din cod" }

      - name: Build (PyInstaller + installer)
        shell: pwsh
        run: .\build.ps1 -SkipTests   # testele au rulat in job-ul „test”

      - name: Sume de control (SHA256SUMS.txt, verificat de actualizarea din aplicatie)
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist\installer\*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          if (-not $lines) { throw "Nu am gasit installer-ul in dist\installer" }
          [IO.File]::WriteAllText("dist\installer\SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          Get-Content dist\installer\SHA256SUMS.txt

      - name: Public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG (Get-ChildItem dist\installer\*.exe) `
            dist\installer\SHA256SUMS.txt `
            --title $env:TAG --generate-notes
